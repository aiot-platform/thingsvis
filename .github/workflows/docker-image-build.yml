name: Docker Image Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot

jobs:
  resolve-version:
    name: Resolve Version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      owner_lower: ${{ steps.version.outputs.owner_lower }}
    steps:
      - name: Resolve version tag
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          OWNER_LOWER="${{ github.repository_owner }}"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "owner_lower=${OWNER_LOWER,,}" >> "$GITHUB_OUTPUT"
          echo "Version: ${TAG}, Owner: ${OWNER_LOWER,,}"

  build-docker:
    name: Build ${{ matrix.image_name }} (${{ matrix.arch }})
    needs: resolve-version
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: thingsvis-server
            dockerfile: apps/server/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            build_args: |
              DATABASE_URL=file:./prisma/dev.db
          - image_name: thingsvis-server
            dockerfile: apps/server/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build_args: |
              DATABASE_URL=file:./prisma/dev.db
          - image_name: thingsvis-studio
            dockerfile: apps/studio/Dockerfile
            arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
            build_args: ""
          - image_name: thingsvis-studio
            dockerfile: apps/studio/Dockerfile
            arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
            build_args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push architecture image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.ACR }}/${{ matrix.image_name }}:${{ needs.resolve-version.outputs.tag }}-${{ matrix.arch }}
          cache-from: type=gha,scope=${{ matrix.image_name }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image_name }}-${{ matrix.arch }}
          # 阿里云容器镜像仓库当前不识别 Buildx 默认生成的 OCI provenance attestation。
          provenance: false
          build-args: ${{ matrix.build_args }}

  publish-manifest:
    name: Publish ${{ matrix.image_name }} manifest
    needs:
      - resolve-version
      - build-docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      fail-fast: false
      matrix:
        image_name:
          - thingsvis-server
          - thingsvis-studio
    steps:
      - name: Log in to Aliyun Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Publish multi-arch manifests
        run: |
          TAG="${{ needs.resolve-version.outputs.tag }}"
          IMAGE="${{ matrix.image_name }}"

          docker buildx imagetools create \
            -t "${ACR}/${IMAGE}:${TAG}" \
            -t "${ACR}/${IMAGE}:latest" \
            "${ACR}/${IMAGE}:${TAG}-amd64" \
            "${ACR}/${IMAGE}:${TAG}-arm64"

  deploy:
    name: Deploy thingsvis to Aliyun server
    needs:
      - resolve-version
      - publish-manifest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Login ACR on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACR_VPC_HOST: crpi-8l7h3z38ikkatd81-vpc.cn-shanghai.personal.cr.aliyuncs.com
          ACR_USER: ${{ secrets.IMAGE_USER }}
          ACR_PASS: ${{ secrets.IMAGE_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$ACR_PASS" | ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login '$ACR_VPC_HOST' -u '$ACR_USER' --password-stdin"
      - name: Update thingsvis services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ needs.resolve-version.outputs.tag }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd /opt/thingspanel
            sed -i 's#^TP_TAG_THINGSVIS=.*#TP_TAG_THINGSVIS=${VERSION}#' .env
            docker compose pull thingsvis-server thingsvis-studio
            docker compose up -d thingsvis-server thingsvis-studio
            docker compose ps thingsvis-server thingsvis-studio
          "
