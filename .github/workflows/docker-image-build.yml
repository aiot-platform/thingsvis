# 工作流名称
name: Docker Image Build
# 触发方式:
# - Push触发: 推送到 dev 分支自动构建并推送自有阿里云 ACR（仅 linux/amd64）
# - Release触发: 创建 Release 时自动构建并推送自有阿里云 ACR（linux/amd64,linux/arm64）
# - 手动触发: 可以通过 GitHub Actions 页面手动触发
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag to build, for example v1.0.23"
        required: false
  push:
    branches:
      - dev
# 构建任务
env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot
  ACR_VPC_HOST: crpi-8l7h3z38ikkatd81-vpc.cn-shanghai.personal.cr.aliyuncs.com
  DEFAULT_VERSION: v1.0.23
jobs:
  # 构建 thingsvis-server / thingsvis-studio 两个镜像
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: thingsvis-server
            dockerfile: apps/server/Dockerfile
            build_args: |
              DATABASE_URL=file:./prisma/dev.db
          - image_name: thingsvis-studio
            dockerfile: apps/studio/Dockerfile
            build_args: ""
    steps:
      # 检出代码
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # 获取版本号
      - name: 获取版本号
        id: get_version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "branch" ]; then
            echo "VERSION=${DEFAULT_VERSION}" >> "$GITHUB_ENV"
            exit 0
          fi
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$RELEASE_TAG" ]; then
            VERSION="$RELEASE_TAG"
          elif [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "${DEFAULT_VERSION}")
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # 登录镜像仓库
      - name: 登录镜像仓库
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}
      # 设置 QEMU / Docker Buildx
      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3
      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3
      # 构建并推送到你的阿里云 ACR：分支推送仅 amd64，发布时多架构
      - name: 构建并推送到 ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ github.event_name == 'push' && 'linux/amd64' || 'linux/amd64,linux/arm64' }}
          push: true
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.ACR }}/${{ matrix.image_name }}:${{ env.VERSION }}
  # 发布/手动触发时，更新阿里云服务器上的 thingsvis 服务
  deploy:
    needs: build
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "${DEPLOY_PORT:-22}" -H "$DEPLOY_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      - name: Login ACR on server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          ACR_USER: ${{ secrets.IMAGE_USER }}
          ACR_PASS: ${{ secrets.IMAGE_PASS }}
        run: |
          set -euo pipefail
          printf '%s' "$ACR_PASS" | ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" \
            "docker login '${ACR_VPC_HOST}' -u '${ACR_USER}' --password-stdin"
      - name: Update thingsvis services
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ github.event.release.tag_name || github.event.inputs.version }}
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/id_deploy -p "${DEPLOY_PORT:-22}" "$DEPLOY_USER@$DEPLOY_HOST" "
            set -e
            cd /opt/thingspanel
            sed -i 's#^TP_TAG_THINGSVIS=.*#TP_TAG_THINGSVIS=${VERSION}#' .env
            docker compose pull thingsvis-server thingsvis-studio
            docker compose up -d thingsvis-server thingsvis-studio
            docker compose ps thingsvis-server thingsvis-studio
          "
