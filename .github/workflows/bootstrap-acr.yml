name: Build & Push thingsvis to ACR

# 把 thingsvis-server / thingsvis-studio 构建成 amd64 镜像并推送到自有阿里云 ACR。
# 仅用于让 All-in-One 首次安装能拉到镜像；只构建 linux/amd64（部署服务器为 x86_64）。
# 触发放式：push 到 master-cdf（push 事件不受默认分支限制）。

on:
  push:
    branches:
      - master-cdf
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot
  VERSION: v1.0.23

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: thingsvis-server
            dockerfile: apps/server/Dockerfile
            build_args: DATABASE_URL=file:./prisma/dev.db
          - image_name: thingsvis-studio
            dockerfile: apps/studio/Dockerfile
            build_args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Login to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push (linux/amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.ACR }}/${{ matrix.image_name }}:${{ env.VERSION }}
