# ThingsPanel 1.2-release 线镜像构建（thingsvis-server / thingsvis-studio）
#
# 只构建并推送到自有阿里云 ACR（peak-aiot 命名空间）。
# 触发：推送 1.2-release 分支，或在 Actions 页面手动触发。
name: Docker Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - 1.2-release

permissions:
  contents: read

env:
  ACR_HOST: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com
  ACR: crpi-8l7h3z38ikkatd81.cn-shanghai.personal.cr.aliyuncs.com/peak-aiot
  VERSION: 1.2-release

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - image_name: thingsvis-server
            dockerfile: apps/server/Dockerfile
            build_args: |
              DATABASE_URL=file:./prisma/dev.db
          - image_name: thingsvis-studio
            dockerfile: apps/studio/Dockerfile
            build_args: ""
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 登录自有 ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_HOST }}
          username: ${{ secrets.IMAGE_USER }}
          password: ${{ secrets.IMAGE_PASS }}

      - name: 设置 QEMU
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建并推送到自有 ACR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          provenance: false
          build-args: ${{ matrix.build_args }}
          tags: |
            ${{ env.ACR }}/${{ matrix.image_name }}:${{ env.VERSION }}
